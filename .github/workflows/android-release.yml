name: Build and publish Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
      - run: flutter pub get
      - name: Build APK with CI build number
        run: |
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)
          flutter build apk --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
      - name: Prepare APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk neru-memory.apk
          cp build/app/outputs/flutter-apk/app-release.apk "neru-memory-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: neru-memory-apk
          path: neru-memory.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="auto-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" neru-memory.apk "neru-memory-${GITHUB_RUN_NUMBER}.apk" --repo "$GITHUB_REPOSITORY" --title "Neru Memory build #${GITHUB_RUN_NUMBER}" --notes "Automatic Android build from ${GITHUB_SHA}." --latest
      - name: Publish update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)
          printf '{"version":"%s","buildNumber":%s,"downloadUrl":"https://github.com/%s/releases/latest/download/neru-memory.apk"}\n' "$VERSION" "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" > update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Android release metadata [skip ci]"
          git push
