name: Build and publish Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"

      - run: flutter pub get

      - run: flutter build apk --release

      - run: cp build/app/outputs/flutter-apk/app-release.apk neru-memory-${GITHUB_RUN_NUMBER}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: neru-memory-apk
          path: neru-memory-${GITHUB_RUN_NUMBER}.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="auto-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" neru-memory-${GITHUB_RUN_NUMBER}.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Neru Memory build #${GITHUB_RUN_NUMBER}" \
            --notes "Automatic Android build from ${GITHUB_SHA}." \
            --latest