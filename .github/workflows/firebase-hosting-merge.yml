name: Deploy Web to Firebase Hosting
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --pwa-strategy=none
      # Keep the legacy worker URL alive so existing browser registrations can
      # update to this self-removing worker instead of retaining a stale cache.
      - run: cp web/legacy_sw_cleanup.js build/web/flutter_service_worker.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NERU_MEMORY }}
          channelId: live
          projectId: neru-memory
